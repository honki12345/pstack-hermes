name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on PRs only. A push to main/develop must keep its full run: its
# artifacts feed verify-determinism, and a cancelled build would skip the
# cross-platform comparison entirely. cancel-in-progress protects only runs that
# have already started; by default only ONE run may be pending per group and a
# newer pending run cancels the older pending one, so two quick merges could
# cancel a queued branch run before it ever starts. Non-PR runs therefore take a
# per-run group and never share a queue slot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_PIN: c742dd61706fbacc1b95f1a20b7b988cf096ce6c

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Shared build prologue (SOURCE_DATE_EPOCH, uv, upstream clone at the pin,
      # SHA verification, Convert, Validate, Scanner gate). The action cannot set
      # `permissions:` itself - that is job/workflow level - so this job's
      # workflow-level `contents: read` above is what authorises the clone.
      - name: Build package from pin
        id: build
        uses: ./.github/actions/build-package
        with:
          upstream-pin: ${{ env.UPSTREAM_PIN }}

      # The gate the previous implementation got wrong: it hashed
      # $GITHUB_WORKSPACE/pstack *after* the build step had already replaced that
      # directory, so it compared build1 against build2 and could never detect a
      # hand-edited or stale committed package. This hashes the committed blobs
      # straight out of the git object store, then compares them against a fresh
      # build from the pin.
      - name: Verify committed package matches a fresh build from the pin
        shell: bash
        env:
          UPSTREAM_CLONE: ${{ steps.build.outputs.upstream-clone-path }}
          PACKAGE_PATH: .
        run: |
          set -euo pipefail
          # Package files only (repo root may also contain build tooling)
          PACKAGE_FILES=(
            "plugin.json"
            "README.md"
            "LICENSE"
            ".build-provenance.txt"
          )
          hash_git_tree() {
            local root="$1"
            {
              for f in "${PACKAGE_FILES[@]}"; do
                if git -C "$root" ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                  printf '%s  %s\n' "$(git -C "$root" show "HEAD:$f" | sha256sum | cut -d' ' -f1)" "$f"
                fi
              done
              if git -C "$root" ls-files --error-unmatch skills >/dev/null 2>&1; then
                git -C "$root" ls-tree -r --name-only HEAD -- skills | grep -v '/$' | while IFS= read -r f; do
                  printf '%s  %s\n' "$(git -C "$root" show "HEAD:$f" | sha256sum | cut -d' ' -f1)" "$f"
                done
              fi
              if git -C "$root" ls-files --error-unmatch config >/dev/null 2>&1; then
                git -C "$root" ls-tree -r --name-only HEAD -- config | grep -v '/$' | while IFS= read -r f; do
                  printf '%s  %s\n' "$(git -C "$root" show "HEAD:$f" | sha256sum | cut -d' ' -f1)" "$f"
                done
              fi
              if git -C "$root" ls-files --error-unmatch assets >/dev/null 2>&1; then
                git -C "$root" ls-tree -r --name-only HEAD -- assets | grep -v '/$' | while IFS= read -r f; do
                  printf '%s  %s\n' "$(git -C "$root" show "HEAD:$f" | sha256sum | cut -d' ' -f1)" "$f"
                done
              fi
            } | grep -v '  \.build-provenance\.txt$' | LC_ALL=C sort -k2 | sha256sum | cut -d' ' -f1
          }
          hash_dir_tree() {
            local root="$1"
            (
              cd "$root" && {
                for f in plugin.json README.md LICENSE; do
                  if [ -f "$f" ]; then
                    printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$f"
                  fi
                done
                for d in skills config assets; do
                  if [ -d "$d" ]; then
                    find "$d" -type f -print | sed 's|^\./||' | while IFS= read -r f; do
                      printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$f"
                    done
                  fi
                done
              }
            ) | grep -v '  \.build-provenance\.txt$' | LC_ALL=C sort -k2 | sha256sum | cut -d' ' -f1
          }
          committed="$(hash_git_tree "$PACKAGE_PATH")"
          rebuilt_dir="$RUNNER_TEMP/pstack-rebuilt"
          uv run --frozen tools/convert.py --source "$UPSTREAM_CLONE" --out "$rebuilt_dir"
          rebuilt="$(hash_dir_tree "$rebuilt_dir")"
          echo "committed: $committed"
          echo "rebuilt:   $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::committed $PACKAGE_PATH/ is not reproducible from pin $UPSTREAM_PIN - hand edits, a stale package, or a missing rebuild"
            exit 1
          fi
          echo "reproducible build: OK (committed package is byte-identical to a fresh build from the pin)"

      # A stale build must never leave scratch siblings behind in the working
      # tree; if one appears, the tree is not clean and the gate above is suspect.
      # A rebuild legitimately rewrites .build-provenance.txt (it re-stamps
      # converted_at), and BOTH hash gates exclude that file by design - it
      # carries a timestamp. Asserting on it would fail every run. Everything
      # else must be untouched: a hand-edited package file, or a leftover
      # pstack.tmp-build / pstack.prev-build scratch dir, still fails here.
      - name: Assert no tracked file changed by the build
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain -- . ':(exclude).build-provenance.txt')"
          if [ -n "$dirty" ]; then
            echo "::error::the build modified tracked files other than the provenance stamp"
            echo "$dirty"
            exit 1
          fi
          echo "no unexpected tracked changes: OK"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pstack-build-${{ matrix.os }}-${{ github.run_id }}
          path: |
            plugin.json
            README.md
            LICENSE
            .build-provenance.txt
            skills/
            config/
            assets/
          include-hidden-files: true
          # Short retention: verify-determinism consumes these within minutes;
          # the artifact is a debugging aid, not a release artifact.
          retention-days: 14

  verify-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pstack-build-*-${{ github.run_id }}
          merge-multiple: false
          path: artifacts

      - name: Compare builds byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t legs < <(find artifacts -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#legs[@]}" -ne 2 ]; then
            echo "::error::expected 2 artifacts, got ${#legs[@]}"
            exit 1
          fi
          tree_hash() {
            ( cd "$1" && find . -type f ! -name ".build-provenance.txt" -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          h1="$(tree_hash "${legs[0]}")"
          h2="$(tree_hash "${legs[1]}")"
          echo "tree A: $h1"
          echo "tree B: $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::platform builds diverge - converter is NOT byte-deterministic"
            diff <(cd "${legs[0]}" && find . -type f ! -name ".build-provenance.txt" | sort) \
                 <(cd "${legs[1]}" && find . -type f ! -name ".build-provenance.txt" | sort) || true
            exit 1
          fi
          echo "cross-platform determinism: OK"

  lint-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      # Cheapest first: a grep over four files, then the workflow linter,
      # then the composite-action shell gate (actionlint does not descend
      # into .github/actions - see tools/check_action_shell.py).
      - name: Upstream pin is in lock-step across workflows
        run: uv run --frozen python tools/check_pins.py

      - name: Dependabot config is valid
        run: uv run --frozen python tools/check_dependabot.py

      # Docs carry the contract agents follow; they drifted once during the
      # root-layout migration. Cheap grep-style gate (see tools/check_docs.py).
      - name: Hand-written docs match the package layout and pin policy
        run: uv run --frozen python tools/check_docs.py

      - name: Lint workflows (actionlint + shellcheck)
        run: uv run --frozen actionlint

      - name: Lint composite-action shell blocks (shellcheck)
        run: uv run --frozen python tools/check_action_shell.py

      # Needs network: reads each pinned action's action.yml from
      # raw.githubusercontent.com. The runner only WARNS on an undeclared
      # `with:` key and silently ignores it (how `syncLabels` vs `sync-labels`
      # shipped), so this is the gate for that class. actionlint cannot cover
      # it: it exits 0 on the exact defect (verified by reintroducing it).
      - name: 'Lint action inputs (undeclared with: keys)'
        run: uv run --frozen python tools/check_action_inputs.py

      - name: Lint (ruff)
        run: uv run --frozen ruff check tools hermes-plugin

      - name: Unit tests (pytest)
        run: uv run --frozen pytest -q

  poteto-mode-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install script dependencies
        working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile

      - name: Unit tests (poteto-mode scripts)
        working-directory: skills/poteto-mode/scripts
        run: bun test watch-pr check-plan.test.ts

      - name: Typecheck (poteto-mode scripts)
        working-directory: skills/poteto-mode/scripts
        run: bunx tsc --project watch-pr/tsconfig.json --noEmit --strict

  pr-checklist:
    # Advisory: reports whether the PR's machine-checkable claims hold. It never
    # blocks a merge - the `build` job is the enforcing gate. Scoped to
    # pull_request only; a push has no PR body to read.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      - name: Check PR description against the tree it proposes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          rc=0
          uv run --frozen python tools/pr_checklist.py "$RUNNER_TEMP/pr-body.md" \
            --provenance .build-provenance.txt || rc=$?
          echo "pr-checklist exit: $rc (0 = consistent, 1 = contradiction)"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::pr-checklist found a contradiction. This job is ADVISORY - it reports, it does not block. The enforcing gate is the build job."
          fi
          exit 0
